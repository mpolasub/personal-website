<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matthew Polasub</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Kantumruy+Pro:wght@700&family=Rubik:ital,wght@0,300;0,400;0,500;1,700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue: rgb(93, 177, 255);
      --purple: rgb(159, 151, 255);
      --dark: rgb(42, 42, 42);
      --nav-h: 64px;
    }

    html, body, #root {
      width: 100%; height: 100%; background: #000; overflow: hidden;
    }

    /* ── Scroll container ── */
    .scroll-wrap {
      width: 100%; height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y proximity;
    }

    .scroll-wrap::-webkit-scrollbar { display: none; }
    .scroll-wrap { scrollbar-width: none; }

    /* ── Sections ── */
    .section {
      width: 100%; min-height: 100vh;
      scroll-snap-align: start;
      position: relative;
    }
    /* only hero needs to contain its floating chars */
    .section[data-section="home"] { overflow: hidden; }

    /* ── Nav ── */
    .nav {
      position: fixed; top: 0; left: 0; width: 100%;
      height: var(--nav-h);
      background: rgba(42,42,42,0.92);
      backdrop-filter: blur(12px);
      display: flex; align-items: center;
      padding: 0 6vw; gap: clamp(20px, 3vw, 40px);
      z-index: 200;
    }
    .nav-logo {
      margin-right: auto;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700; font-size: 18px;
      color: #fff; letter-spacing: 0.04em;
      cursor: pointer;
    }
    .nav-link {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600; font-size: 13px;
      color: #fff; letter-spacing: 0.12em;
      text-transform: uppercase; cursor: pointer;
      transition: color 0.25s ease;
      background: none; border: none;
    }
    .nav-link:hover { color: var(--blue); }
    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(16px, 2.2vw, 30px);
    }
    .nav-hamburger {
      display: none;
      width: 42px; height: 42px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.04);
      color: #fff;
      align-items: center; justify-content: center;
      cursor: pointer;
      transition: border-color 0.25s ease, background 0.25s ease;
    }
    .nav-hamburger:hover {
      border-color: rgba(93,177,255,0.5);
      background: rgba(93,177,255,0.12);
    }
    .nav-hamburger-lines {
      position: relative;
      width: 18px; height: 14px;
      display: inline-block;
    }
    .nav-hamburger-lines span {
      position: absolute; left: 0; right: 0;
      height: 2px; border-radius: 2px;
      background: currentColor;
      transition: transform 0.25s ease, opacity 0.25s ease, top 0.25s ease;
    }
    .nav-hamburger-lines span:nth-child(1) { top: 0; }
    .nav-hamburger-lines span:nth-child(2) { top: 6px; }
    .nav-hamburger-lines span:nth-child(3) { top: 12px; }
    .nav-hamburger.open .nav-hamburger-lines span:nth-child(1) {
      top: 6px; transform: rotate(45deg);
    }
    .nav-hamburger.open .nav-hamburger-lines span:nth-child(2) {
      opacity: 0;
    }
    .nav-hamburger.open .nav-hamburger-lines span:nth-child(3) {
      top: 6px; transform: rotate(-45deg);
    }

    /* ── Swap text ── */
    .swap {
      position: relative; display: inline-block; cursor: default;
    }
    .swap .orig {
      display: block;
      transition: opacity 0.35s ease;
    }
    .swap .alt {
      position: absolute; left: 0; top: 0;
      opacity: 0; color: var(--blue);
      transition: opacity 0.35s ease;
      white-space: nowrap; pointer-events: none;
    }
    .swap:hover .orig { opacity: 0.15; }
    .swap:hover .alt  { opacity: 1; }

    /* ── Expand text on hover ── */
    .expand {
      display: inline-block;
      transition: letter-spacing 0.4s cubic-bezier(.16,1,.3,1);
      cursor: default;
    }
    .expand:hover { letter-spacing: 0.15em; }

    /* ── Blue radial proximity overlay ── */
    .proximity-overlay {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 1;
      transition: opacity 0.2s ease;
    }

    /* ── Section: Hero ── */
    .hero-bg {
      position: absolute; inset: 0;
      background: #000;
    }
    .hero-content {
      position: relative; z-index: 2;
      padding: calc(var(--nav-h) + 6vh) 6vw 6vh;
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr min(420px, 35vw);
      gap: clamp(24px, 3vw, 48px);
      align-items: center;
    }
    .hero-left { position: relative; }
    .hero-terminal-wrap { width: 100%; }
    .hero-plus-field {
      position: absolute; inset: 0;
      pointer-events: none;
    }
    .hero-plus {
      position: absolute;
      font-family: 'Kantumruy Pro', sans-serif;
      font-weight: 700;
      color: var(--blue);
      line-height: 1;
      user-select: none;
    }
    .hero-greeting {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300; font-size: clamp(14px, 1.6vw, 22px);
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.05em;
      margin-bottom: clamp(10px, 1.2vh, 16px);
    }
    .hero-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700; font-size: clamp(32px, 5vw, 72px);
      color: #fff; line-height: 1.05;
      margin-bottom: clamp(14px, 2vh, 24px);
      text-wrap: balance;
    }
    .hero-name .blue { color: var(--blue); }
    .hero-sub {
      font-family: 'Rubik', sans-serif;
      font-weight: 300; font-size: clamp(14px, 1.4vw, 20px);
      color: rgba(255,255,255,0.55);
      line-height: 1.6; max-width: 520px;
    }
    .hero-sub strong {
      color: rgba(255,255,255,0.9);
      font-weight: 500; font-style: italic;
    }

    /* Terminal */
    .terminal {
      width: 100%;
      max-height: min(420px, 42vh);
      border-radius: clamp(12px, 1.5vw, 18px);
      background: rgba(14,18,28,0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(93,177,255,0.15);
      box-shadow: 0 8px 48px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
      display: flex; flex-direction: column;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }
    .terminal-bar {
      display: flex; align-items: center; gap: 7px;
      padding: clamp(10px, 1.2vw, 14px) clamp(14px, 1.8vw, 20px);
      border-bottom: 1px solid rgba(93,177,255,0.08);
      flex-shrink: 0;
    }
    .terminal-dot {
      width: 11px; height: 11px; border-radius: 50%;
    }
    .terminal-title {
      margin-left: 8px;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px; font-weight: 600;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.08em;
    }
    .terminal-body {
      padding: clamp(16px, 2vw, 24px);
      flex: 1; overflow-y: auto;
      scrollbar-width: none;
      display: flex; flex-direction: column;
      gap: 4px;
    }
    .terminal-body::-webkit-scrollbar { display: none; }
    .terminal-line {
      font-size: clamp(12px, 1.1vw, 14px);
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .t-prompt { color: rgba(93,177,255,0.6); }
    .t-cmd    { color: rgba(255,255,255,0.85); }
    .t-out    { color: rgba(255,255,255,0.45); }
    .t-blue   { color: rgb(93,177,255); }
    .t-purple { color: rgb(159,151,255); }
    .t-green  { color: rgb(100,220,150); }
    .t-dim    { color: rgba(255,255,255,0.25); }
    .t-cursor {
      display: inline-block;
      width: 8px; height: clamp(12px, 1.1vw, 14px);
      background: rgb(93,177,255);
      vertical-align: middle;
      animation: blink 1.1s step-end infinite;
      margin-left: 2px;
    }
    @keyframes floatChar {
      0%, 100% { transform: translateY(0px);   }
      50%       { transform: translateY(-10px); }
    }
    @keyframes gradientShift {
      0%   { background-position: 0% 0%; }
      100% { background-position: 100% 0%; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    @media (max-width: 980px) {
      .nav {
        justify-content: space-between;
      }
      .nav-links {
        position: absolute;
        top: calc(var(--nav-h) + 8px);
        right: 6vw;
        min-width: 220px;
        padding: 12px;
        border-radius: 14px;
        border: 1px solid rgba(93,177,255,0.25);
        background: rgba(10,14,24,0.96);
        box-shadow: 0 18px 36px rgba(0,0,0,0.45);
        display: none;
        flex-direction: column;
        align-items: stretch;
        gap: 4px;
      }
      .nav-links.open {
        display: flex;
      }
      .nav-link {
        text-align: left;
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
      }
      .nav-link:hover {
        background: rgba(93,177,255,0.12);
      }
      .nav-hamburger {
        display: inline-flex;
      }

      .hero-content {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        align-content: center;
        gap: clamp(16px, 3vh, 30px);
      }
      .hero-left {
        order: 1;
      }
      .hero-terminal-wrap {
        order: 2;
        max-width: 720px;
      }
      .terminal {
        max-height: min(360px, 42vh);
      }

      .about-content {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        align-content: center;
        gap: clamp(18px, 3vh, 28px);
      }
      .about-photo {
        order: 1;
        max-width: min(420px, 78vw);
        justify-self: center;
      }
      .about-right {
        order: 2;
      }
    }

    /* ── Section: Interests ── */
    .interests-bg {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgb(8,12,20) 0%, rgb(12,16,26) 100%);
    }
    .interests-content {
      position: relative; z-index: 2;
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr;
      gap: 0;
      padding: calc(var(--nav-h) + 4vh) 6vw 4vh;
    }
    .interests-header {
      grid-column: 1 / -1;
      margin-bottom: clamp(20px, 3vh, 36px);
    }
    .interests-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600; font-size: 13px;
      color: var(--blue); letter-spacing: 0.2em;
      text-transform: uppercase; margin-bottom: 10px;
    }
    .interests-heading {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700; font-size: clamp(28px, 4vw, 60px);
      color: #fff;
    }

    /* Blueprint room */
    .blueprint-wrap {
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .blueprint-svg-wrap {
      width: 100%; max-width: 540px;
      position: relative;
    }
    .blueprint-svg-wrap svg {
      width: 100%; height: auto;
    }

    /* Hotspots */
    .hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 10;
    }
    .hotspot-ring {
      width: clamp(28px, 3.5vw, 46px);
      height: clamp(28px, 3.5vw, 46px);
      border-radius: 50%;
      border: 2px solid var(--blue);
      background: rgba(93,177,255,0.12);
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(13px, 1.6vw, 20px);
      transition: background 0.25s, transform 0.25s, box-shadow 0.25s;
      box-shadow: 0 0 0 0 rgba(93,177,255,0.3);
    }
    .hotspot:hover .hotspot-ring,
    .hotspot.active .hotspot-ring {
      background: rgba(93,177,255,0.25);
      transform: scale(1.15);
      box-shadow: 0 0 0 6px rgba(93,177,255,0.12);
    }
    .hotspot-pulse {
      position: absolute; inset: -6px;
      border-radius: 50%;
      border: 1px solid rgba(93,177,255,0.3);
      animation: pulse 2.4s ease-out infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(1);   opacity: 0.6; }
      100% { transform: scale(1.7); opacity: 0; }
    }
    .hotspot.active .hotspot-pulse { animation: none; }

    /* Info panel */
    .interests-panel {
      display: flex; align-items: center;
      padding-left: clamp(24px, 4vw, 56px);
    }
    .interests-panel-inner {
      width: 100%;
    }
    .panel-empty {
      font-family: 'Rubik', sans-serif;
      font-size: clamp(14px, 1.2vw, 17px);
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.04em;
    }
    .panel-card {
      animation: fadeSlideIn 0.35s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateX(16px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .panel-icon {
      font-size: clamp(40px, 5.5vw, 72px);
      margin-bottom: clamp(12px, 1.8vh, 20px);
      line-height: 1;
    }
    .panel-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700; font-size: clamp(24px, 3vw, 44px);
      color: #fff; margin-bottom: clamp(12px, 1.5vh, 18px);
    }
    .panel-desc {
      font-family: 'Rubik', sans-serif;
      font-size: clamp(14px, 1.2vw, 18px);
      color: rgba(255,255,255,0.55);
      line-height: 1.75; max-width: 420px;
    }
    .panel-hint {
      margin-top: clamp(14px, 2vh, 24px);
      font-family: 'Montserrat', sans-serif;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(93,177,255,0.4);
    }

    /* ── Section: About ── */
    .about-bg {
      position: absolute; inset: 0;
      background: rgb(42,42,42);
    }
    .about-content {
      position: relative; z-index: 2;
      height: 100vh;
      display: grid;
      grid-template-columns: min(380px, 28vw) 1fr;
      gap: clamp(32px, 4vw, 64px);
      align-items: center;
      padding: calc(var(--nav-h) + 5vh) 6vw 5vh;
    }
    .about-photo {
      width: 100%; aspect-ratio: 9/11;
      border-radius: clamp(14px, 1.8vw, 24px);
      background: url('./assets/photo.jpg') center / cover no-repeat;
      box-shadow: 0 32px 64px rgba(0,0,0,0.5);
    }
    .about-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600; font-size: 13px;
      color: var(--blue); letter-spacing: 0.2em;
      text-transform: uppercase; margin-bottom: clamp(12px, 2vh, 20px);
    }
    .about-heading {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700; font-size: clamp(28px, 4vw, 60px);
      color: #fff; line-height: 1.1; margin-bottom: clamp(18px, 2.5vh, 32px);
    }
    .about-body {
      font-family: 'Rubik', sans-serif;
      font-weight: 400; font-size: clamp(14px, 1.3vw, 18px);
      color: rgba(255,255,255,0.7);
      line-height: 1.75; max-width: 600px;
    }
    @media (max-width: 980px) {
      .about-content {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        align-content: center;
        gap: clamp(18px, 3vh, 28px);
      }
      .about-photo {
        order: 1;
        max-width: min(420px, 78vw);
        justify-self: center;
      }
      .about-right {
        order: 2;
      }
    }

    /* ── Section: Skills ── */
    .skills-bg {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgb(42,42,42) 0%, #000 100%);
    }
    .skills-content {
      position: relative; z-index: 2;
      height: 100vh;
      display: flex; flex-direction: column;
      justify-content: center;
      padding: calc(var(--nav-h) + 5vh) 6vw 5vh;
    }
    .skills-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600; font-size: 13px;
      color: var(--blue); letter-spacing: 0.2em;
      text-transform: uppercase; margin-bottom: clamp(12px, 1.5vh, 20px);
    }
    .skills-heading {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700; font-size: clamp(28px, 4vw, 60px);
      color: #fff; margin-bottom: clamp(32px, 5vh, 56px);
    }
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(24px, 3vw, 40px); max-width: min(900px, 80vw);
    }
    .skills-group-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600; font-size: 13px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.15em; text-transform: uppercase;
      margin-bottom: clamp(12px, 1.8vh, 20px);
    }
    .skills-list {
      display: flex; flex-direction: column; gap: clamp(8px, 1.2vh, 14px);
    }
    .skill-tag {
      font-family: 'Rubik', sans-serif;
      font-weight: 400; font-size: clamp(15px, 1.4vw, 20px);
      color: #fff;
      cursor: default;
      transition: color 0.25s ease;
    }
    .skill-tag:hover { color: var(--blue); }

    /* ── Section: Contact ── */
    .contact-bg {
      position: absolute; inset: 0;
      background: #000;
    }
    .contact-content {
      position: relative; z-index: 2;
      height: 100vh;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center;
      padding: calc(var(--nav-h) + 5vh) 6vw 5vh;
    }
    .contact-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600; font-size: 13px;
      color: var(--blue); letter-spacing: 0.2em;
      text-transform: uppercase; margin-bottom: clamp(14px, 2vh, 24px);
    }
    .contact-heading {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700; font-size: clamp(36px, 6vw, 88px);
      color: #fff; line-height: 1.05;
      margin-bottom: clamp(20px, 3.5vh, 40px);
      text-wrap: balance;
    }
    .contact-sub {
      font-family: 'Rubik', sans-serif;
      font-size: clamp(14px, 1.3vw, 18px); color: rgba(255,255,255,0.5);
      margin-bottom: clamp(32px, 5vh, 56px);
    }
    .contact-btn {
      display: inline-flex; align-items: center; gap: 12px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700; font-size: clamp(12px, 1vw, 14px);
      letter-spacing: 0.1em; text-transform: uppercase;
      color: #000; background: var(--blue);
      border: none; border-radius: 100px;
      padding: clamp(12px, 1.5vh, 18px) clamp(24px, 3vw, 40px);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .contact-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(93,177,255,0.4);
    }

    /* ── Section: Experience & Education ── */
    .exp-bg {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, #000 0%, rgb(18,22,32) 100%);
    }
    .exp-content {
      position: relative; z-index: 2;
      height: 100vh;
      display: flex; flex-direction: column;
      padding: calc(var(--nav-h) + 4vh) 6vw 4vh;
    }
    .exp-tabs {
      display: flex; gap: 2px;
      margin-bottom: clamp(24px, 3.5vh, 44px);
      background: rgba(255,255,255,0.04);
      border-radius: 100px; padding: 4px;
      width: fit-content; flex-shrink: 0;
    }
    .exp-tab {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600; font-size: clamp(11px, 1vw, 13px);
      letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      background: none; border: none;
      padding: clamp(8px,1vh,12px) clamp(18px,2.5vw,32px);
      border-radius: 100px; cursor: pointer;
      transition: color 0.25s, background 0.25s;
    }
    .exp-tab.active { color: #fff; background: rgba(93,177,255,0.15); }
    .exp-tab:hover:not(.active) { color: rgba(255,255,255,0.7); }
    .exp-list {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      gap: clamp(12px, 2vh, 20px);
      overflow-y: auto; scrollbar-width: none;
    }
    .exp-list::-webkit-scrollbar { display: none; }
    .exp-item {
      display: grid;
      grid-template-columns: clamp(100px,14vw,180px) 1fr;
      gap: clamp(20px,3vw,48px);

    .exp-date {

    .projects-content {
      position: relative; z-index: 2;

      font-family: 'Montserrat', sans-serif;
      font-weight: 600; font-size: 13px;

      font-family: 'Rubik', sans-serif;
      font-size: 14px; color: rgba(255,255,255,0.3);
      letter-spacing: 0.08em;
      padding-bottom: 6px;

    .projects-counter span { color: #fff; }

    /* Carousel track */
    .carousel-outer {
      position: relative; flex: 1; min-height: 0;
      display: flex; align-items: stretch;
      overflow: hidden;
    }
    .carousel-track {
      display: flex; width: 100%;
      transition: transform 0.6s cubic-bezier(.16,1,.3,1);
      will-change: transform;
    }
    .project-card {
      flex-shrink: 0;
      width: 100%;
      border-radius: clamp(16px, 2vw, 28px);
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 8px 48px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      transition: border-color 0.3s ease;
    }
    .project-card:hover {
      border-color: rgba(93,177,255,0.25);
    }
    .project-card-thumb {
      background: rgba(93,177,255,0.06);
      display: flex; align-items: center; justify-content: center;
      border-right: 1px solid rgba(255,255,255,0.07);

    .project-card-thumb-inner {
      width: clamp(56px, 8vw, 110px); height: clamp(56px, 8vw, 110px);
      border: 2px solid rgba(93,177,255,0.2);
      border-radius: clamp(12px, 1.5vw, 20px);
      display: flex; align-items: center; justify-content: center;
      color: rgba(93,177,255,0.4);
      font-family: 'Montserrat', monospace;
      font-size: clamp(20px, 3vw, 40px); font-weight: 700;
    }
    .project-card-body {
      padding: clamp(28px, 4vw, 56px);
      display: flex; flex-direction: column;
      justify-content: center;
      gap: clamp(12px, 1.8vh, 20px);
    }
    .project-card-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700; font-size: clamp(20px, 2.4vw, 36px); color: #fff;
    }
    .project-card-desc {
      font-family: 'Rubik', sans-serif;
      font-size: clamp(14px, 1.2vw, 18px); color: rgba(255,255,255,0.55);
      line-height: 1.7;
    }
    .project-card-tags {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-top: 4px;
    }
    .project-tag {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(9px, 0.75vw, 11px); font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--blue);
      border: 1px solid rgba(93,177,255,0.25);
      border-radius: 100px; padding: 5px 14px;
    }
    @media (max-width: 980px) {
      .project-card {
        grid-template-columns: 1fr;
      }
      .project-card-thumb {
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,0.07);
        min-height: 220px;
      }
      .project-card-body {
        padding: clamp(20px, 4vw, 34px);
      }
    }

    /* Arrow buttons */
    .carousel-arrows {
      display: flex; gap: 12px; margin-top: clamp(20px, 3vh, 36px);
      flex-shrink: 0;
    }
    .carousel-arrow {
      width: clamp(36px, 4vw, 48px); height: clamp(36px, 4vw, 48px);
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: transparent; color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: clamp(14px, 1.4vw, 18px);
      transition: border-color 0.25s, background 0.25s, transform 0.2s;
    }
    .carousel-arrow:hover {
      border-color: var(--blue);
      background: rgba(93,177,255,0.1);
    }
    .carousel-arrow:active { transform: scale(0.93); }
    .carousel-arrow:disabled {
      opacity: 0.2; cursor: default;
      pointer-events: none;
    }

    /* Progress bar */
    .carousel-progress {
      display: flex; gap: 8px; align-items: center;
      margin-top: clamp(20px, 3vh, 36px);
    }
    .carousel-pip {
      height: 2px; border-radius: 2px;
      background: rgba(255,255,255,0.15);
      transition: width 0.4s cubic-bezier(.16,1,.3,1), background 0.4s ease;
      cursor: pointer;
    }
    .carousel-pip.active {
      background: var(--blue);
    }

    /* ── Ambient orbs ── */
    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      filter: blur(90px);
      will-change: transform;
    }

    /* ── Section bleed overlay ── */
    .bleed-overlay {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 2;
      will-change: opacity, background;
    }

    /* ── Scroll dot indicator ── */
    .scroll-dots {
      position: fixed; right: 28px; top: 50%;
      transform: translateY(-50%);
      z-index: 150;
      display: flex; flex-direction: column; gap: 10px;
    }
    .scroll-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,0.25);
      cursor: pointer;
      transition: background 0.3s ease, transform 0.3s ease;
    }
    .scroll-dot.active {
      background: var(--blue);
      transform: scale(1.5);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const SECTIONS = ['home', 'about', 'experience', 'projects', 'interests', 'contact'];

    function SwapText({ children, alt, style, className }) {
      return (
        <span className={`swap ${className || ''}`} style={style}>
          <span className="orig">{children}</span>
          <span className="alt">{alt}</span>
        </span>
      );
    }

    function Nav({ activeSection, scrollTo }) {
      const [menuOpen, setMenuOpen] = React.useState(false);
      const items = ['About', 'Experience', 'Projects', 'Interests', 'Contact'];

      React.useEffect(() => {
        setMenuOpen(false);
      }, [activeSection]);

      return (
        <nav className="nav">
          <div className="nav-logo" onClick={() => scrollTo('home')}>MP</div>
          <button
            className={`nav-hamburger ${menuOpen ? 'open' : ''}`}
            onClick={() => setMenuOpen(o => !o)}
            aria-label="Toggle navigation menu"
            aria-expanded={menuOpen}
          >
            <span className="nav-hamburger-lines">
              <span />
              <span />
              <span />
            </span>
          </button>
          <div className={`nav-links ${menuOpen ? 'open' : ''}`}>
            {items.map(item => (
              <button
                key={item}
                className="nav-link"
                onClick={() => {
                  scrollTo(item.toLowerCase());
                  setMenuOpen(false);
                }}
              >
                {item}
              </button>
            ))}
          </div>
        </nav>
      );
    }

    const TERMINAL_SEQUENCE = [
      { type: 'cmd',  text: 'whoami',                         delay: 600  },
      { type: 'out',  text: 'matthew_polasub',                delay: 180  },
      { type: 'cmd',  text: 'cat about.txt',                  delay: 700  },
      { type: 'blue', text: 'Student @ Columbia University',  delay: 120  },
      { type: 'out',  text: 'Software engineer in training',  delay: 80   },

      { type: 'cmd',  text: 'ls interests/',                  delay: 800  },
      { type: 'purple',text:'guitar   cars   chess   watches',delay: 120  },
      { type: 'cmd',  text: 'git log --oneline -3',           delay: 800  },
      { type: 'green', text:'a3f91bc  shipped portfolio v1',  delay: 100  },
      { type: 'green', text:'8d02e11  added isometric room',  delay: 80   },
      { type: 'green', text:'c1a44d7  fixed that one bug',    delay: 80   },
      { type: 'cmd',  text: 'echo $STATUS',                   delay: 800  },
      { type: 'blue', text: 'open to internships · NYC · 2027', delay: 120 },
      { type: 'cmd',  text: '',                               delay: 600  },
    ];

    function Terminal() {
      const [lines, setLines] = React.useState([]);
      const [typing, setTyping] = React.useState('');
      const [phase, setPhase] = React.useState(0); // which sequence item
      const [charIdx, setCharIdx] = React.useState(0);
      const [showCursor, setShowCursor] = React.useState(true);
      const bodyRef = React.useRef(null);

      // Auto-scroll terminal body
      React.useEffect(() => {
        if (bodyRef.current) {
          bodyRef.current.scrollTop = bodyRef.current.scrollHeight;
        }
      }, [lines, typing]);

      React.useEffect(() => {
        if (phase >= TERMINAL_SEQUENCE.length) return;
        const item = TERMINAL_SEQUENCE[phase];

        if (charIdx === 0 && item.type === 'cmd') {
          // pause before typing command
          const t = setTimeout(() => setCharIdx(1), item.delay);
          return () => clearTimeout(t);
        }

        if (item.type === 'cmd' && charIdx <= item.text.length) {
          // type out command char by char
          const t = setTimeout(() => {
            setTyping(item.text.slice(0, charIdx));
            setCharIdx(c => c + 1);
          }, 55 + Math.random() * 40);
          return () => clearTimeout(t);
        }

        // Command fully typed — commit to lines and move on
        const t = setTimeout(() => {
          if (item.type === 'cmd') {
            setLines(l => [...l, { type: 'cmd', text: item.text }]);
          } else {
            setLines(l => [...l, { type: item.type, text: item.text }]);
          }
          setTyping('');
          setCharIdx(0);
          setPhase(p => p + 1);
        }, item.type === 'cmd' ? 200 : item.delay);
        return () => clearTimeout(t);
      }, [phase, charIdx]);

      const renderLine = (line, i) => {
        const cls = line.type === 'cmd' ? 't-cmd'
          : line.type === 'blue' ? 't-blue'
          : line.type === 'purple' ? 't-purple'
          : line.type === 'green' ? 't-green'
          : 't-out';
        return (
          <div key={i} className="terminal-line">
            {line.type === 'cmd' && <span className="t-prompt">matthew@portfolio:~$ </span>}
            <span className={cls}>{line.text}</span>
          </div>
        );
      };

      const currentItem = TERMINAL_SEQUENCE[phase];
      const isDone = phase >= TERMINAL_SEQUENCE.length;

      return (
        <div className="terminal">
          <div className="terminal-bar">
            <div className="terminal-dot" style={{ background: '#ff5f57' }} />
            <div className="terminal-dot" style={{ background: '#febc2e' }} />
            <div className="terminal-dot" style={{ background: '#28c840' }} />
            <span className="terminal-title">matthew@portfolio: ~</span>
          </div>
          <div className="terminal-body" ref={bodyRef}>
            {lines.map((l, i) => renderLine(l, i))}
            {/* Currently typing line */}
            {!isDone && currentItem && currentItem.type === 'cmd' && (
              <div className="terminal-line">
                <span className="t-prompt">matthew@portfolio:~$ </span>
                <span className="t-cmd">{typing}</span>
                <span className="t-cursor" />
              </div>
            )}
            {/* Idle cursor at end */}
            {isDone && (
              <div className="terminal-line">
                <span className="t-prompt">matthew@portfolio:~$ </span>
                <span className="t-cursor" />
              </div>
            )}
          </div>
        </div>
      );
    }

    function FloatingChar({ char, style }) {
      return (
        <span className="hero-plus" style={style}>{char}</span>
      );
    }

    function HeroSection() {
      const CHARS = ['[]', '<>', '{}', '\\', '*', '&', '#', '$', '+', '-', ';', ':'];
      const positions = [
        { top: '12%', left: '2%',  size: 80,  speed: 3.8, delay: 0    },
        { top: '72%', left: '5%',  size: 60,  speed: 5.1, delay: 0.7  },
        { top: '30%', left: '55%', size: 44,  speed: 4.3, delay: 1.4  },
        { top: '78%', left: '42%', size: 90,  speed: 6.2, delay: 0.3  },
        { top: '8%',  left: '45%', size: 52,  speed: 3.5, delay: 2.1  },
        { top: '55%', left: '25%', size: 38,  speed: 4.8, delay: 1.0  },
        { top: '20%', left: '70%', size: 66,  speed: 5.5, delay: 0.5  },
      ];

      const [charIndices, setCharIndices] = React.useState(
        positions.map((_, i) => i % CHARS.length)
      );

      React.useEffect(() => {
        const intervals = positions.map((p, i) => {
          return setInterval(() => {
            setCharIndices(prev => {
              const next = [...prev];
              next[i] = (next[i] + 1) % CHARS.length;
              return next;
            });
          }, p.speed * 1000);
        });
        return () => intervals.forEach(clearInterval);
      }, []);

      return (
        <section className="section" data-section="home">
          <div className="hero-bg" />
          <div className="hero-content">
            <div className="hero-left">
              <div className="hero-plus-field" data-parallax-hero="true">
                {positions.map((p, i) => (
                  <FloatingChar key={i} char={CHARS[charIndices[i]]} style={{
                    top: p.top, left: p.left,
                    fontSize: p.size,
                    opacity: 0.10 + (i % 3) * 0.04,
                    transition: `opacity 0.6s ease`,
                    animation: `floatChar ${p.speed}s ${p.delay}s ease-in-out infinite`,
                  }} />
                ))}
              </div>
              <p className="hero-greeting">Hi, my name's</p>
              <h1 className="hero-name" style={{
                background: 'linear-gradient(90deg, rgb(130,195,255), rgb(185,225,255), rgb(110,185,255), rgb(160,215,255))',
                backgroundSize: '300% 100%',
                WebkitBackgroundClip: 'text',
                WebkitTextFillColor: 'transparent',
                backgroundClip: 'text',
                animation: 'gradientShift 3s linear infinite',
              }}>
                MATTHEW POLASUB.
              </h1>
              <p className="hero-sub">
                Full-time student at Columbia University.
              </p>
            </div>
            <div className="hero-terminal-wrap">
              <Terminal />
            </div>
          </div>
        </section>
      );
    }

    const INTERESTS = [
      { name: 'Snowboarder', type: 'Ice', hp: 90, bgGrad: 'linear-gradient(155deg,#9fd5e8 0%,#ceeef8 50%,#78b8d8 100%)', typeColor: '#4a9ab8', detail: 'Snoqualmie Pass, WA', body: 'Riding the slopes at Snoqualmie Pass. Nothing like breaking a leg on the mountain (pun intended).', moves: [{ name: 'Shred', damage: 40 }, { name: 'Steeze', damage: 60 }], rarity: '◆◆◆' },
      { name: 'Guitarist', type: 'Electric', hp: 80, bgGrad: 'linear-gradient(155deg,#f5e070 0%,#faf5b0 50%,#e8c040 100%)', typeColor: '#b88010', detail: 'Ibanez', body: 'I like playing pop, rock, and fingerstyle. Inspired by Steve Vai, Keshi, Polyphia, and my dad.', moves: [{ name: 'Also Shred', damage: 50 }, { name: 'Riff', damage: 70 }], rarity: '◆◆◆◆' },
      { name: 'Drummer', type: 'Fighting', hp: 120, bgGrad: 'linear-gradient(155deg,#e07868 0%,#f0a898 50%,#c85848 100%)', typeColor: '#a03030', detail: 'Pop & Rock', body: 'Drumming in pop, rock, and k-pop. I promise my neighbors still love me.', moves: [{ name: 'Hi-hat', damage: 60 }, { name: 'Paradiddle', damage: 90 }], rarity: '◆◆◆' },
      { name: 'Car Enthusiast', type: 'Fire', hp: 110, bgGrad: 'linear-gradient(155deg,#f89060 0%,#fcc090 50%,#e06830 100%)', typeColor: '#b84010', detail: 'SLS AMG', body: 'Big JDM and European car guy. SLS AMG one day.', moves: [{ name: 'Drift', damage: 80 }, { name: 'Downshift', damage: 100 }], rarity: '◆◆◆◆◆' },
      { name: 'Chess Player', type: 'Psychic', hp: 70, bgGrad: 'linear-gradient(155deg,#e888b0 0%,#f8b8d0 50%,#d06890 100%)', typeColor: '#a03068', detail: '~1000 ELO · Rapid', body: 'Rated ~1000 in rapid on Chess.com. Still developing middlegame intuition.', moves: [{ name: "Sicilian Defense", damage: 55 }, { name: 'Vienna Game', damage: 75 }], rarity: '◆◆' },
      { name: 'Watch Collector', type: 'Steel', hp: 85, bgGrad: 'linear-gradient(155deg,#b0c0d0 0%,#d0e0f0 50%,#90a8c0 100%)', typeColor: '#5878a0', detail: 'Citizen Tsuyosa', body: 'Currently wearing a Citizen Tsuyosa. Catch me wearing a Speedmaster or a Day-Date in a few years.', moves: [{ name: 'Mechanical Movement', damage: 45 }, { name: 'Chronograph', damage: 65 }], rarity: '◆◆◆' },
    ];

    function CardIllustration({ name }) {
      if (name === 'Snowboarder') return (
        <img
          src="assets/snowboarder.png"
          alt="Snowboarder"
          style={{ width:'100%', height:'100%', objectFit:'cover', display:'block' }}
        />

      if (name === 'Guitarist') return (
        <img
          src="assets/guitarist.png"
          alt="Guitarist"
          style={{ width:'100%', height:'100%', objectFit:'cover', display:'block' }}
        />
      );
      if (name === 'Drummer') return (
        <img
          src="assets/drummer.png"
          alt="Drummer"
          style={{ width:'100%', height:'100%', objectFit:'cover', display:'block' }}
        />
      );
      if (name === 'Car Enthusiast') return (
        <img
          src="assets/car-enthusiast.png"

        />

      if (name === 'Chess Player') return (
        <img

        />

      if (name === 'Watch Collector') return (

        />
      );
      return <div style={{ display:'flex', alignItems:'center', justifyContent:'center', width:'100%', height:'100%' }}><span style={{ fontSize: 48 }}>?</span></div>;
    }

    function CardBack() {
      return (
        <div style={{
          width: '100%', height: '100%',
          borderRadius: 14,
          background: 'linear-gradient(135deg,#090918,#10142a,#090f22)',
          border: '2.5px solid rgba(93,177,255,0.22)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          overflow: 'hidden', position: 'relative',
        }}>
          <div style={{ position:'absolute', inset:0, backgroundImage:`repeating-linear-gradient(45deg,rgba(93,177,255,0.038) 0px,rgba(93,177,255,0.038) 1px,transparent 1px,transparent 14px)` }} />
          <div style={{ width:'68%', height:'68%', border:'2px solid rgba(93,177,255,0.18)', borderRadius:10, display:'flex', alignItems:'center', justifyContent:'center', background:'rgba(93,177,255,0.04)', flexDirection:'column', gap:8, position:'relative' }}>
            <span style={{ fontFamily:"'Montserrat',sans-serif", fontWeight:800, fontSize:'clamp(20px,2.4vw,32px)', color:'rgba(93,177,255,0.55)', letterSpacing:'0.1em' }}>MP</span>
          </div>
        </div>
      );
    }

    function StaticCardFront({ interest }) {
      return (
        <div style={{ width:'100%', height:'100%', borderRadius:14, background:interest.bgGrad, border:`2.5px solid ${interest.typeColor}`, overflow:'hidden', boxShadow:'0 8px 28px rgba(0,0,0,0.52)' }}>
          <div style={{ padding:'8px 8px 6px', height:'100%', display:'flex', flexDirection:'column', gap:4 }}>

    function PokemonCard({ interest }) {
      const [mouse, setMouse] = React.useState({ x: 0.5, y: 0.5 });
      const [hovered, setHovered] = React.useState(false);
      const [flipped, setFlipped] = React.useState(false);
      const ref = React.useRef(null);

      const onMove = (e) => {
        const r = ref.current.getBoundingClientRect();
        setMouse({ x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height });
      };

      const rx = hovered ? (0.5 - mouse.y) * 22 : 0;
      const ry = hovered ? (mouse.x - 0.5) * 22 : 0;
      const holoAngle = Math.atan2(mouse.y - 0.5, mouse.x - 0.5) * 180 / Math.PI + 90;

      return (
        <div ref={ref}
          onMouseMove={onMove}
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => { setHovered(false); setMouse({ x: 0.5, y: 0.5 }); }}
          onClick={() => setFlipped(f => !f)}
          style={{ width:'100%', height:'100%', perspective:700, cursor:'pointer' }}>
          <div style={{
            width:'100%', height:'100%', position:'relative',
            transformStyle:'preserve-3d',
            transform: flipped ? `rotateY(180deg) rotateX(${-rx*0.3}deg)` : `rotateX(${rx}deg) rotateY(${ry}deg)`,
            transition: (hovered && !flipped) ? 'transform 0.08s ease' : 'transform 0.65s cubic-bezier(.16,1,.3,1)',
            willChange:'transform',
          }}>
            {/* FRONT */}
            <div style={{
              position:'absolute', inset:0, backfaceVisibility:'hidden',
              borderRadius:14, background:interest.bgGrad,
              border:`2.5px solid ${interest.typeColor}`,
              boxShadow: hovered
                ? `0 28px 56px rgba(0,0,0,0.72),0 0 0 1px ${interest.typeColor},inset 0 0 0 1px rgba(255,255,255,0.28)`
                : `0 8px 28px rgba(0,0,0,0.52),inset 0 0 0 1px rgba(255,255,255,0.08)`,
              overflow:'hidden', transition:'box-shadow 0.3s ease',
            }}>
              <div style={{ position:'absolute', inset:0, zIndex:5, background:`linear-gradient(${holoAngle}deg,transparent 0%,rgba(255,0,100,0.38) 12%,rgba(255,200,0,0.38) 28%,rgba(0,255,100,0.38) 44%,rgba(0,200,255,0.38) 60%,rgba(150,0,255,0.38) 76%,rgba(255,0,100,0.28) 88%,transparent 100%)`, opacity:hovered?1:0, mixBlendMode:'color-dodge', borderRadius:14, transition:'opacity 0.35s ease', pointerEvents:'none' }} />
              <div style={{ position:'absolute', inset:0, zIndex:6, background:`radial-gradient(circle at ${mouse.x*100}% ${mouse.y*100}%,rgba(255,255,255,0.38) 0%,rgba(255,255,255,0.08) 28%,transparent 58%)`, opacity:hovered?1:0, borderRadius:14, transition:'opacity 0.35s ease', pointerEvents:'none' }} />
              <div style={{ position:'absolute', inset:0, zIndex:7, backgroundImage:`radial-gradient(circle,rgba(255,255,255,0.92) 1px,transparent 1px)`, backgroundSize:'26px 26px', backgroundPosition:`${mouse.x*26}px ${mouse.y*26}px`, opacity:hovered?0.28:0, borderRadius:14, transition:'opacity 0.35s ease', pointerEvents:'none' }} />
              <div style={{ padding:'8px 8px 6px', height:'100%', display:'flex', flexDirection:'column', gap:4, position:'relative', zIndex:2 }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline' }}>
                  <span style={{ fontFamily:"'Montserrat',sans-serif", fontWeight:800, fontSize:'clamp(8px,0.85vw,11px)', color:'#111', letterSpacing:'0.02em' }}>{interest.name.toUpperCase()}</span>
                  <span style={{ fontFamily:"'Montserrat',sans-serif", fontWeight:700, fontSize:'clamp(7px,0.75vw,9px)', color:'#333' }}>HP <strong style={{ fontSize:'clamp(10px,1vw,13px)', color:'#111' }}>{interest.hp}</strong></span>
                </div>
                <div style={{ flex:1, borderRadius:7, border:`1.5px solid ${interest.typeColor}`, overflow:'hidden', position:'relative', background:'rgba(0,0,0,0.06)' }}>

                  <div style={{ position:'absolute', inset:0, background:`radial-gradient(circle at ${mouse.x*100}% ${mouse.y*100}%,rgba(255,255,255,0.18),transparent 65%)`, pointerEvents:'none' }} />
                </div>
                <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                  <span style={{ background:interest.typeColor, color:'#fff', fontFamily:"'Montserrat',sans-serif", fontWeight:700, fontSize:'clamp(6px,0.6vw,8px)', padding:'2px 6px', borderRadius:100, letterSpacing:'0.07em', textTransform:'uppercase', flexShrink:0 }}>{interest.type}</span>
                  <span style={{ flex:1 }} />

    function InterestsSection() {
      const [current, setCurrent] = React.useState(0);
      const [dragStart, setDragStart] = React.useState(null);
      const [dragDelta, setDragDelta] = React.useState(0);
      const isDragging = React.useRef(false);
      const N = INTERESTS.length;

      const go = (dir) => setCurrent(c => Math.max(0, Math.min(N - 1, c + dir)));

      React.useEffect(() => {
        const h = (e) => { if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); };
        window.addEventListener('keydown', h);
        return () => window.removeEventListener('keydown', h);
      }, []);

      const onDragStart = (x) => { setDragStart(x); setDragDelta(0); isDragging.current = false; };
      const onDragMove = (x) => {
        if (dragStart === null) return;
        const d = x - dragStart;
        setDragDelta(d);
        if (Math.abs(d) > 8) isDragging.current = true;
      };
      const onDragEnd = () => {
        if (dragStart !== null && isDragging.current) {
          if (dragDelta < -55) go(1);
          else if (dragDelta > 55) go(-1);
        }
        setDragStart(null); setDragDelta(0);
      };

      const getPos = (offset) => {
        const abs = Math.abs(offset), sign = Math.sign(offset) || 1;
        const drift = dragStart !== null ? dragDelta * 0.22 : 0;
        if (abs === 0) return { x: drift, scale: 1.22, rotY: 0, opacity: 1, z: 4, type: 'center' };
        if (abs === 1) return { x: sign * 295 + drift, scale: 0.80, rotY: sign * -10, opacity: 0.72, z: 3, type: 'side' };
        return { x: sign * 488 + drift, scale: 0.60, rotY: sign * -28, opacity: 0.38, z: 2, type: 'back' };
      };

      return (
        <section className="section" data-section="interests">
          <div className="interests-bg" />
          <div style={{ position:'relative', zIndex:2, height:'100vh', display:'flex', flexDirection:'column', padding:'calc(var(--nav-h) + 2.5vh) 0 2.5vh', overflow:'hidden' }}>

            <div style={{ padding:'0 6vw', marginBottom:'clamp(14px,2.2vh,26px)', flexShrink:0 }}>
              <p style={{ fontFamily:"'Montserrat',sans-serif", fontWeight:600, fontSize:13, color:'var(--blue)', letterSpacing:'0.2em', textTransform:'uppercase', marginBottom:8 }}>Beyond the code</p>
              <h2 style={{ fontFamily:"'Montserrat',sans-serif", fontWeight:700, fontSize:'clamp(24px,3.5vw,52px)', color:'#fff' }}>Interests</h2>
            </div>

            {/* Carousel */}
            <div
              style={{ flex:1, position:'relative', display:'flex', alignItems:'center', justifyContent:'center', perspective:'1400px', cursor: dragStart !== null ? 'grabbing' : 'grab', userSelect:'none' }}
              onMouseDown={e => onDragStart(e.clientX)}
              onMouseMove={e => onDragMove(e.clientX)}
              onMouseUp={onDragEnd}
              onMouseLeave={onDragEnd}
              onTouchStart={e => onDragStart(e.touches[0].clientX)}
              onTouchMove={e => { e.preventDefault(); onDragMove(e.touches[0].clientX); }}
              onTouchEnd={onDragEnd}
            >
              {INTERESTS.map((interest, i) => {
                const offset = i - current;
                if (Math.abs(offset) > 2) return null;
                const { x, scale, rotY, opacity, z, type } = getPos(offset);
                return (
                  <div key={i} style={{
                    position:'absolute',
                    width:'clamp(200px,19vw,280px)',
                    aspectRatio:'5/7',
                    transform:`translateX(${x}px) scale(${scale}) rotateY(${rotY}deg)`,
                    transformOrigin:'center center',
                    zIndex:z, opacity,
                    transition: dragStart !== null ? 'opacity 0.1s' : 'all 0.55s cubic-bezier(.16,1,.3,1)',
                    pointerEvents: type === 'center' ? 'auto' : 'none',
                    filter: type === 'center' ? 'none' : 'brightness(0.82)',
                  }}>
                    {type === 'back'
                      ? <CardBack />
                      : type === 'side'
                        ? <StaticCardFront interest={interest} />
                        : <PokemonCard interest={interest} />
                    }
                  </div>
                );
              })}
            </div>

            {/* Controls */}
            <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:16, padding:'0 6vw', flexShrink:0, marginTop:'clamp(10px,1.8vh,18px)' }}>
              <button onClick={() => go(-1)} disabled={current===0} className="carousel-arrow">←</button>
              <div style={{ display:'flex', gap:8, alignItems:'center' }}>
                {INTERESTS.map((_, i) => (
                  <div key={i} onClick={() => setCurrent(i)} style={{ height:6, borderRadius:3, width:i===current?24:6, background:i===current?'var(--blue)':'rgba(255,255,255,0.2)', cursor:'pointer', transition:'all 0.3s ease' }} />
                ))}
              </div>
              <button onClick={() => go(1)} disabled={current===N-1} className="carousel-arrow">→</button>
            </div>

            <p style={{ fontFamily:"'Rubik',sans-serif", fontSize:11, color:'rgba(255,255,255,0.18)', textAlign:'center', letterSpacing:'0.08em', marginTop:8, flexShrink:0 }}>
              HOVER TO SHINE · CLICK TO FLIP · DRAG TO BROWSE
            </p>
          </div>
        </section>
      );
    }

                <span>{idx + 1}</span> / {PROJECTS.length}
              </div>
            </div>

            <div className="carousel-outer" data-reveal="true">
              <div className="carousel-track" style={{ transform: `translateX(-${idx * 100}%)` }}>
                {PROJECTS.map((p, i) => (
                  <div key={i} className="project-card">
                    <div className="project-card-thumb" style={{ background: p.color, padding: 0, overflow: 'hidden' }}>
                      {p.video ? (
                        <iframe
                          width="100%" height="100%"
                          src={p.video}
                          title={p.title}
                          frameBorder="0"
                          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                          allowFullScreen
                          style={{ display: 'block', minHeight: 0 }}
                        />
                      ) : p.image ? (
                        <img
                          src={p.image}
                          alt={`${p.title} preview`}
                          style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }}
                          loading="lazy"
                        />
                      ) : (
                        <div className="project-card-thumb-inner" style={{ color: `rgba(${p.color.match(/[\d.]+/g).slice(0,3).join(',')},0.8)`, borderColor: `rgba(${p.color.match(/[\d.]+/g).slice(0,3).join(',')},0.3)` }}>{p.letter}</div>
                      )}
                    </div>
                    <div className="project-card-body">
                      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                        <div className="project-card-title">{p.title}</div>
                        {p.badge && (
                          <span style={{
                            fontFamily: "'Montserrat', sans-serif", fontSize: 9, fontWeight: 700,
                            letterSpacing: '0.1em', textTransform: 'uppercase',
                            color: 'rgb(93,177,255)', border: '1px solid rgba(93,177,255,0.4)',
                            borderRadius: 100, padding: '4px 10px', whiteSpace: 'nowrap', flexShrink: 0,
                          }}>{p.badge}</span>
                        )}
                      </div>
                      <div className="project-card-desc">{p.desc}</div>
                      <div className="project-card-tags">
                        {p.tags.map(t => (
                          <span key={t} className="project-tag">{t}</span>
                        ))}
                      </div>
                      <div style={{ display: 'flex', gap: 12, marginTop: 4 }}>
                        {p.links && p.links.map(link => (
                          <a key={link.label} href={link.href}
                            style={{
                              fontFamily: "'Montserrat', sans-serif", fontSize: 11, fontWeight: 700,
                              letterSpacing: '0.1em', textTransform: 'uppercase',
                              color: 'rgba(255,255,255,0.5)', textDecoration: 'none',
                              borderBottom: '1px solid rgba(255,255,255,0.15)', paddingBottom: 2,
                              transition: 'color 0.2s, border-color 0.2s',
                            }}
                            onMouseEnter={e => { e.target.style.color='rgb(93,177,255)'; e.target.style.borderColor='rgba(93,177,255,0.5)'; }}
                            onMouseLeave={e => { e.target.style.color='rgba(255,255,255,0.5)'; e.target.style.borderColor='rgba(255,255,255,0.15)'; }}
                            target="_blank" rel="noopener noreferrer"
                          >{link.label}</a>
                        ))}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: 24 }} data-reveal="true">
              <div className="carousel-arrows">
                <button className="carousel-arrow" disabled={idx === 0}
                  onClick={() => setIdx(i => Math.max(0, i - 1))}>←</button>
                <button className="carousel-arrow" disabled={idx === PROJECTS.length - 1}
                  onClick={() => setIdx(i => Math.min(PROJECTS.length - 1, i + 1))}>→</button>
              </div>
              <div className="carousel-progress">
                {PROJECTS.map((_, i) => (
                  <div key={i} className={`carousel-pip ${i === idx ? 'active' : ''}`}
                    style={{ width: i === idx ? 32 : 16 }}
                    onClick={() => setIdx(i)} />
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    }

    function ContactSection() {

          sub: 'github.com/mpolasub',
          icon: (
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
          ),
        },
        {

          sub: 'linkedin.com/in/mpolasub',
          icon: (
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
              <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
            </svg>
          ),
        },
      ];

      const [hovered, setHovered] = React.useState(null);

      return (
        <section className="section" data-section="contact">
          <div className="contact-bg" />
          <div className="contact-content">

            <h2 className="contact-heading" data-reveal="true" style={{ marginBottom: 'clamp(40px, 6vh, 72px)' }}>Contact me.</h2>
            <div data-reveal="true" style={{ display: 'flex', flexDirection: 'column', gap: 'clamp(12px, 2vh, 20px)', width: '100%', maxWidth: 540 }}>
              {links.map((link, i) => (
                <a

                    <span style={{

                  <span style={{
                    color: hovered === i ? 'rgba(93,177,255,0.8)' : 'rgba(255,255,255,0.12)',

    function App() {
      const scrollRef = useRef(null);
      const [proximity, setProximity] = useState(0);
      const [activeSection, setActiveSection] = useState(0);
      const rafRef = useRef(null);
      const targetProximity = useRef(0);

      // Scroll-driven: orb parallax + hero parallax + reveals
      useEffect(() => {
        const wrap = scrollRef.current;
        if (!wrap) return;
        let raf;
        const onScroll = () => {
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(() => {
            const scrollY = wrap.scrollTop;
            const vh = wrap.clientHeight;

            // Orbs
            document.querySelectorAll('[data-orb]').forEach(orb => {
              const rate = parseFloat(orb.dataset.orbRate || 0.2);
              orb.style.transform = `translateY(${-scrollY * rate}px)`;
            });

            // Hero chars parallax
            const heroField = document.querySelector('[data-parallax-hero]');
            if (heroField) heroField.style.transform = `translateY(${scrollY * 0.28}px)`;

            // Section color bleed
            const SECTION_COLORS = ['#000000','rgb(42,42,42)','rgb(12,16,26)','#000000','rgb(10,14,22)','#000000'];
            const sectionIdx = Math.min(Math.floor(scrollY / vh), SECTION_COLORS.length - 1);
            const sectionProgress = (scrollY % vh) / vh;
            const bleedProgress = Math.max(0, (sectionProgress - 0.45) / 0.55);
            const nextColor = SECTION_COLORS[Math.min(sectionIdx + 1, SECTION_COLORS.length - 1)];
            const bleedEl = document.querySelector('.bleed-overlay');
            if (bleedEl) {
              bleedEl.style.background = `linear-gradient(to top, ${nextColor} 0%, transparent 55%)`;
              bleedEl.style.opacity = bleedProgress;
            }
          });
        };
        wrap.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
        return () => { wrap.removeEventListener('scroll', onScroll); cancelAnimationFrame(raf); };
      }, []);

      // Mouse proximity to center
      useEffect(() => {
        const handleMouse = (e) => {
          const cx = window.innerWidth / 2;
          const cy = window.innerHeight / 2;
          const dx = (e.clientX - cx) / cx;
          const dy = (e.clientY - cy) / cy;
          const dist = Math.sqrt(dx * dx + dy * dy) / Math.sqrt(2);
          targetProximity.current = Math.max(0, 1 - dist);
        };
        window.addEventListener('mousemove', handleMouse);

        // Smooth interpolation loop
        let raf;
        let cur = 0;
        const loop = () => {
          cur += (targetProximity.current - cur) * 0.06;
          setProximity(cur);
          raf = requestAnimationFrame(loop);
        };
        raf = requestAnimationFrame(loop);

        return () => {
          window.removeEventListener('mousemove', handleMouse);
          cancelAnimationFrame(raf);
        };
      }, []);

      // Track active section via scroll
      useEffect(() => {
        const wrap = scrollRef.current;
        if (!wrap) return;
        const handleScroll = () => {
          const h = wrap.clientHeight;
          const idx = Math.round(wrap.scrollTop / h);
          setActiveSection(Math.min(idx, SECTIONS.length - 1));
        };
        wrap.addEventListener('scroll', handleScroll, { passive: true });
        return () => wrap.removeEventListener('scroll', handleScroll);
      }, []);

      const scrollTo = useCallback((sectionId) => {
        const wrap = scrollRef.current;
        if (!wrap) return;
        const idx = SECTIONS.indexOf(sectionId);
        if (idx >= 0) wrap.scrollTo({ top: idx * wrap.clientHeight, behavior: 'smooth' });
      }, []);

      // Blue proximity overlay
      const blueIntensity = Math.pow(proximity, 1.5);

      return (
        <>
          {/* Ambient orbs */}
          <div className="ambient-orb" data-orb="0" data-orb-rate="0.12" style={{
            width: 640, height: 640,
            background: 'radial-gradient(circle, rgba(93,177,255,0.16) 0%, transparent 70%)',
            left: '-8%', top: '8%',
          }} />
          <div className="ambient-orb" data-orb="1" data-orb-rate="0.38" style={{
            width: 520, height: 520,
            background: 'radial-gradient(circle, rgba(159,151,255,0.13) 0%, transparent 70%)',
            left: '62%', top: '-4%',
          }} />
          <div className="ambient-orb" data-orb="2" data-orb-rate="0.62" style={{
            width: 720, height: 720,
            background: 'radial-gradient(circle, rgba(40,120,210,0.10) 0%, transparent 70%)',
            left: '18%', top: '42%',
          }} />

          {/* Section bleed overlay */}
          <div className="bleed-overlay" />

          {/* Proximity blue overlay */}
          <div className="proximity-overlay" style={{
            background: `radial-gradient(ellipse 55% 55% at 50% 50%, rgba(20,60,160,${blueIntensity * 0.35}), transparent 70%)`,
          }} />

          <Nav activeSection={SECTIONS[activeSection]} scrollTo={scrollTo} />

          {/* Scroll dot nav */}
          <div className="scroll-dots">
            {SECTIONS.map((s, i) => (
              <div key={s} className={`scroll-dot ${i === activeSection ? 'active' : ''}`}
                onClick={() => scrollTo(s)} title={s} />
            ))}
          </div>

          <div className="scroll-wrap" ref={scrollRef}>
            <HeroSection />
            <AboutSection />
            <ExperienceSection />
            <ProjectsSection />
            <InterestsSection />
            <ContactSection />
          </div>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
